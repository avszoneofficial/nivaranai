<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NivaranAi - Smart AI Comparison Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B0F19; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        .ai-card { background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .ai-card:hover { border-color: rgba(99, 102, 241, 0.4); transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="border-b border-gray-800 bg-gray-950/50 px-6 py-4 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-xl tracking-wider shadow-lg shadow-indigo-500/20">Ω</div>
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-indigo-400 bg-clip-text text-transparent">NivaranAi</span>
        </div>
        <div class="flex items-center gap-2">
            <input type="password" id="groqApiKey" class="bg-gray-900 border border-gray-800 rounded-lg px-3 py-1.5 text-xs text-gray-300 placeholder-gray-500 focus:outline-none focus:border-indigo-500 w-48 md:w-64" placeholder="🔑 Enter Groq API Key Here...">
        </div>
    </nav>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
        
        <div class="bg-gray-900/40 p-4 rounded-2xl border border-gray-800/80 shadow-2xl">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-wand-magic-sparkles absolute left-4 top-4 text-indigo-400"></i>
                    <textarea id="userPrompt" rows="1" class="w-full bg-gray-950 border border-gray-800 rounded-xl pl-12 pr-4 py-3 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-indigo-500 resize-none text-base" placeholder="Apna topic ya sawal yahan likhein..."></textarea>
                </div>
                <button onclick="generateAnswers()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-600/20 active:scale-95">
                    <span>Nivaran Karein</span> <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 flex-1">
            
            <div class="ai-card rounded-2xl p-4 flex flex-col h-[550px]">
                <div class="flex items-center justify-between border-b border-gray-800/60 pb-3 mb-3">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-emerald-400 text-lg"></i><h3 class="font-semibold text-gray-200">ChatGPT (Llama-3)</h3></div>
                    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-medium">Active</span>
                </div>
                <div id="chatgpt-response" class="flex-1 text-sm text-gray-400 overflow-y-auto leading-relaxed whitespace-pre-line">Aapke prompt ka intezar hai...</div>
            </div>

            <div class="ai-card rounded-2xl p-4 flex flex-col h-[550px]">
                <div class="flex items-center justify-between border-b border-gray-800/60 pb-3 mb-3">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-feather text-orange-400 text-lg"></i><h3 class="font-semibold text-gray-200">Claude Style</h3></div>
                    <span class="text-[10px] bg-orange-500/10 text-orange-400 px-2 py-0.5 rounded-full font-medium">Active</span>
                </div>
                <div id="claude-response" class="flex-1 text-sm text-gray-400 overflow-y-auto leading-relaxed whitespace-pre-line">Aapke prompt ka intezar hai...</div>
            </div>

            <div class="ai-card rounded-2xl p-4 flex flex-col h-[550px]">
                <div class="flex items-center justify-between border-b border-gray-800/60 pb-3 mb-3">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-circle-nodes text-blue-400 text-lg"></i><h3 class="font-semibold text-gray-200">Gemini Style</h3></div>
                    <span class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full font-medium">Active</span>
                </div>
                <div id="gemini-response" class="flex-1 text-sm text-gray-400 overflow-y-auto leading-relaxed whitespace-pre-line">Aapke prompt ka intezar hai...</div>
            </div>

            <div class="ai-card rounded-2xl p-4 flex flex-col h-[550px]">
                <div class="flex items-center justify-between border-b border-gray-800/60 pb-3 mb-3">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-xmark text-white text-lg"></i><h3 class="font-semibold text-gray-200">Grok 2 Style</h3></div>
                    <span class="text-[10px] bg-gray-500/20 text-gray-300 px-2 py-0.5 rounded-full font-medium">Active</span>
                </div>
                <div id="grok-response" class="flex-1 text-sm text-gray-400 overflow-y-auto leading-relaxed whitespace-pre-line">Aapke prompt ka intezar hai...</div>
            </div>

            <div class="ai-card rounded-2xl p-4 flex flex-col h-[550px]">
                <div class="flex items-center justify-between border-b border-gray-800/60 pb-3 mb-3">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-brain text-cyan-400 text-lg"></i><h3 class="font-semibold text-gray-200">DeepSeek-V3</h3></div>
                    <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full font-medium">Active</span>
                </div>
                <div id="deepseek-response" class="flex-1 text-sm text-gray-400 overflow-y-auto leading-relaxed whitespace-pre-line">Aapke prompt ka intezar hai...</div>
            </div>

        </div>
    </main>

    <script>
        async function callGroqAPI(apiKey, prompt, systemInstruction) {
            try {
                // CORS error bypass karne ke liye hum corsproxy.io ka use kar rahe hain
                const proxyUrl = 'https://corsproxy.io/?';
                const targetUrl = 'https://api.groq.com/openai/v1/chat/completions';
                
                const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return `API Error: ${data.error.message}`;
                }
                return data.choices[0].message.content;
            } catch (error) {
                return "Network connection slow hai ya proxy block ho rahi hai. Ek baar fir try karein.";
            }
        }

        async function generateAnswers() {
            const apiKey = document.getElementById('groqApiKey').value.trim();
            const prompt = document.getElementById('userPrompt').value.trim();

            if (!apiKey) {
                alert("Kripya pehle top-right corner mein apni Groq API Key dalein!");
                return;
            }
            if (!prompt) {
                alert("Kripya koi topic ya sawal dalein!");
                return;
            }

            const models = ['chatgpt', 'claude', 'gemini', 'grok', 'deepseek'];
            models.forEach(model => {
                document.getElementById(`${model}-response`).innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full gap-2 text-gray-500">
                        <i class="fa-solid fa-spinner animate-spin text-xl text-indigo-500"></i>
                        <span>Thinking...</span>
                    </div>
                `;
            });

            // System instructions customizing each box behavior
            const instructions = {
                chatgpt: "Respond strictly in the personality of OpenAI's ChatGPT. Be structured, formal, and direct.",
                claude: "Respond strictly in the personality of Anthropic's Claude. Be highly creative, detailed, natural, and thoughtful.",
                gemini: "Respond strictly in the personality of Google Gemini. Be factual, logical, and provide point-by-point data.",
                grok: "Respond strictly in the personality of xAI Grok. Be slightly witty, sharp, direct, and conversational.",
                deepseek: "Respond strictly in the personality of DeepSeek. Focus deeply on detailed logical reasoning, analysis, and execution steps."
            };

            // Run all API calls in parallel (Simultaneously)
            Promise.all([
                callGroqAPI(apiKey, prompt, instructions.chatgpt),
                callGroqAPI(apiKey, prompt, instructions.claude),
                callGroqAPI(apiKey, prompt, instructions.gemini),
                callGroqAPI(apiKey, prompt, instructions.grok),
                callGroqAPI(apiKey, prompt, instructions.deepseek)
            ]).then(responses => {
                document.getElementById('chatgpt-response').innerText = responses[0];
                document.getElementById('claude-response').innerText = responses[1];
                document.getElementById('gemini-response').innerText = responses[2];
                document.getElementById('grok-response').innerText = responses[3];
                document.getElementById('deepseek-response').innerText = responses[4];
            });
        }
    </script>
</body>
</html>
